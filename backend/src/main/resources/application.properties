server.port=8081
spring.application.name=online-banking-system

# Active profile: Use PostgreSQL container for persistent banking data
spring.profiles.active=postgres

# JPA / Hibernate SQL logging
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator metrics configuration for quantitative performance evaluation
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.metrics.enabled=true

# Redis settings
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}

# JWT Token configuration (signing secret is configurable via environment variable)
app.jwt.secret=${JWT_SECRET:OnlineBankingSystemSecureJwtSecretKeyMustBeAtLeast256BitsLongForHmacSha256!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Frontend origin for receipt routing and web redirects
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Token Bucket Rate Limiter settings (15-second refill interval and 15-second retry-after)
ratelimiter.retry-after-seconds=15
ratelimiter.refill-interval-ms=15000
ratelimiter.refill-rate=20
ratelimiter.capacity=10


