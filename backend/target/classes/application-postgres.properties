# PostgreSQL Profile: Connect to local PostgreSQL Shard 1 (and shard 2 configuration ready)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bank_shard1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Primary Shard 1 connection properties
app.datasource.shard1.url=${SHARD1_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bank_shard1}
app.datasource.shard1.username=${SHARD1_DATASOURCE_USERNAME:postgres}
app.datasource.shard1.password=${SHARD1_DATASOURCE_PASSWORD:postgres}

# Secondary Shard 2 connection properties
app.datasource.shard2.url=${SHARD2_DATASOURCE_URL:jdbc:postgresql://localhost:5433/bank_shard2}
app.datasource.shard2.username=${SHARD2_DATASOURCE_USERNAME:postgres}
app.datasource.shard2.password=${SHARD2_DATASOURCE_PASSWORD:postgres}

# Secondary Shard 3 connection properties
app.datasource.shard3.url=${SHARD3_DATASOURCE_URL:jdbc:postgresql://localhost:5434/bank_shard3}
app.datasource.shard3.username=${SHARD3_DATASOURCE_USERNAME:postgres}
app.datasource.shard3.password=${SHARD3_DATASOURCE_PASSWORD:postgres}

# Secondary Shard 4 connection properties
app.datasource.shard4.url=${SHARD4_DATASOURCE_URL:jdbc:postgresql://localhost:5435/bank_shard4}
app.datasource.shard4.username=${SHARD4_DATASOURCE_USERNAME:postgres}
app.datasource.shard4.password=${SHARD4_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
