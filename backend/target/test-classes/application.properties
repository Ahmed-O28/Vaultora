server.port=8081
spring.application.name=online-banking-system-test

# Isolated in-memory H2 test database for unit & integration test suites
spring.datasource.url=jdbc:h2:mem:bank_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Actuator & Redis settings
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.metrics.enabled=true
spring.data.redis.host=localhost
spring.data.redis.port=6380

# JWT Token configuration for testing
app.jwt.secret=TestSecretKeyMustBeAtLeast256BitsLongForHmacSha256InUnitTestsOnly!
app.jwt.expiration-ms=86400000

# Frontend origin for receipt routing and web redirects
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Rate Limiter settings
ratelimiter.retry-after-seconds=15
ratelimiter.refill-interval-ms=15000
ratelimiter.refill-rate=20
ratelimiter.capacity=10

