version: '3.8'

services:
  # PostgreSQL Database Shard 1
  postgres-shard1:
    image: postgres:16-alpine
    container_name: bank_postgres_shard1
    environment:
      POSTGRES_DB: bank_shard1
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - shard1_data:/var/lib/postgresql/data
    restart: unless-stopped

  # PostgreSQL Database Shard 2
  postgres-shard2:
    image: postgres:16-alpine
    container_name: bank_postgres_shard2
    environment:
      POSTGRES_DB: bank_shard2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - shard2_data:/var/lib/postgresql/data
    restart: unless-stopped

  # PostgreSQL Database Shard 3
  postgres-shard3:
    image: postgres:16-alpine
    container_name: bank_postgres_shard3
    environment:
      POSTGRES_DB: bank_shard3
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - shard3_data:/var/lib/postgresql/data
    restart: unless-stopped

  # PostgreSQL Database Shard 4
  postgres-shard4:
    image: postgres:16-alpine
    container_name: bank_postgres_shard4
    environment:
      POSTGRES_DB: bank_shard4
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - shard4_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Redis Key-Value Store & Caching Layer
  redis:
    image: redis:7-alpine
    container_name: bank_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  shard1_data:
  shard2_data:
  shard3_data:
  shard4_data:
  redis_data:
